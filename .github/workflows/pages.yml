# Publishes the site whenever main moves.
#
# GitHub Pages has two sources: "Deploy from a branch", which rebuilds by
# itself, and "GitHub Actions", which only ever deploys what a workflow hands
# it. A repository set to the second with no workflow in it keeps serving the
# last deployment it ever got — pushes land, the page does not change, and
# nothing anywhere reports an error. This is that workflow.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a queued run supersedes an older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the whole repository is the site: one index.html beside its images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
